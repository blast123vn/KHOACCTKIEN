<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KHOACCTKIEN</title>

<style>
:root{
  --bg:#070b14;--panel:#0f172a;--panel2:#111c31;--line:#24324a;
  --text:#f8fafc;--muted:#94a3b8;--blue:#3b82f6;--purple:#8b5cf6;
  --green:#22c55e;--red:#ef4444;--orange:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#3b82f615,transparent 30%),radial-gradient(circle at 90% 100%,#8b5cf615,transparent 30%),var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}
.header{height:70px;position:fixed;left:0;right:0;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b1120dd;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:900}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 25px #3b82f644}
.header-right{display:flex;align-items:center;gap:12px}.profile-mini{display:flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--panel2);border:2px solid #3b82f666;display:grid;place-items:center}
.sidebar{position:fixed;left:0;top:70px;bottom:0;width:255px;padding:20px 14px;border-right:1px solid var(--line);background:#0a1020ee;backdrop-filter:blur(18px);overflow-y:auto}
.nav-title{color:#64748b;font-size:11px;font-weight:900;letter-spacing:1px;padding:12px 12px 6px}
.nav{width:100%;padding:12px 14px;margin:3px 0;border:0;border-radius:12px;color:var(--muted);background:transparent;text-align:left;font-weight:700;transition:.2s}
.nav:hover,.nav.active{color:#fff;background:linear-gradient(90deg,#3b82f622,#8b5cf612);transform:translateX(2px)}
.admin-label{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:5px;background:#ef444422;color:#f87171;font-size:9px}
.main{margin-left:255px;padding:96px 30px 40px;max-width:1500px}
.page-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.page-title h1{margin:0;font-size:28px}.page-title p{color:var(--muted);margin:7px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:linear-gradient(145deg,#101a2d,#0d1526);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 35px #0003}.card:hover{border-color:#3b82f655}.stat{position:relative;overflow:hidden}.stat-icon{font-size:28px;margin-bottom:12px}.stat-number{font-size:30px;font-weight:900}.stat-name{color:var(--muted);margin-top:4px}
.btn{border:0;border-radius:10px;padding:10px 15px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.orange{background:var(--orange);color:#111}.btn.small{padding:7px 10px;font-size:12px}
.search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:#fff;outline:none}.search:focus{border-color:var(--blue)}
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.account-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:17px}.account{position:relative;overflow:hidden}
.account-image{height:150px;border-radius:13px;background:linear-gradient(135deg,#172554,#312e81);display:grid;place-items:center;font-size:60px;overflow:hidden;margin-bottom:15px}.account-image img{width:100%;height:100%;object-fit:cover}.account-image .account-image-gallery{display:flex;width:100%;height:100%;gap:4px;overflow-x:auto}.account-image .account-image-gallery img{flex:0 0 85%;width:85%;height:100%;object-fit:cover;border-radius:8px}
.account-game{font-size:12px;color:#60a5fa;font-weight:900;text-transform:uppercase}.account-name{font-size:20px;font-weight:900;margin:5px 0}.code{display:inline-block;padding:5px 8px;border-radius:7px;background:#3b82f614;border:1px solid #3b82f633;color:#93c5fd;font-family:monospace;font-size:12px}.note{color:var(--muted);font-size:13px;margin:12px 0}
.password-box{padding:10px;background:#080d18;border:1px solid var(--line);border-radius:9px;font-family:monospace;color:#64748b;margin:10px 0}.account-actions{display:flex;flex-wrap:wrap;gap:7px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.image-upload-box{border:1px dashed #475569;border-radius:14px;padding:16px;background:#0a1222}.image-upload-box input[type=file]{padding:10px;background:#111c31}.image-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:9px;margin-top:12px}.image-preview-item{position:relative;height:90px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111c31}.image-preview-item img{width:100%;height:100%;object-fit:cover}.image-preview-label{font-size:11px;color:var(--muted);margin-top:7px}.field{margin:12px 0}.field.full{grid-column:1/-1}.field label{display:block;color:#cbd5e1;font-size:13px;font-weight:800;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:#94a3b8;font-size:12px}td{color:#e2e8f0}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900}.badge.green{background:#22c55e1c;color:#4ade80}.badge.red{background:#ef44441c;color:#f87171}.badge.blue{background:#3b82f61c;color:#60a5fa}.badge.orange{background:#f59e0b1c;color:#fbbf24}
.email-group{border:1px solid var(--line);background:var(--panel2);border-radius:15px;margin:12px 0;overflow:hidden}.email-head{padding:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#172033}.email-list{padding:8px 15px 15px}.email-account{padding:9px 0;border-bottom:1px solid #24324a88;color:#cbd5e1}.email-account:last-child{border-bottom:0}
.chat{height:calc(100vh - 160px);min-height:500px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}.chat-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat-head h2{margin:0}.chat-status{font-size:12px;color:var(--muted)}.chat-messages{flex:1;overflow-y:auto;padding:20px}.message{display:flex;gap:10px;margin-bottom:16px}.message.me{flex-direction:row-reverse}.message-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0}.message-body{max-width:75%}.message-name{font-size:12px;font-weight:900;color:#93c5fd;margin-bottom:4px}.message.me .message-name{text-align:right}.message-bubble{padding:10px 13px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);line-height:1.5;white-space:pre-wrap}.message.me .message-bubble{background:linear-gradient(135deg,#2563eb,#4f46e5);border:0}.message-time{font-size:10px;color:#64748b;margin-top:4px}.chat-input{display:flex;gap:8px;padding:13px;border-top:1px solid var(--line)}.chat-input input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:#fff}.chat-off{margin:20px;padding:25px;text-align:center;border:1px dashed #ef444466;border-radius:15px;color:#fca5a5;background:#ef44440a}
.profile-card{max-width:700px}.profile-avatar-big{width:120px;height:120px;border-radius:50%;object-fit:cover;display:grid;place-items:center;margin:0 auto 15px;background:var(--panel2);border:4px solid var(--blue);font-size:50px}.cooldown{padding:13px;border-radius:10px;background:#f59e0b10;border:1px solid #f59e0b44;color:#fbbf24;margin-top:10px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:#0d1628;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 80px #0008}.dialog h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;padding:13px 17px;border-radius:12px;background:#111c31;border:1px solid var(--line);box-shadow:0 15px 40px #0007;animation:toast .25s ease}@keyframes toast{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty{padding:45px;text-align:center;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-box{width:min(420px,100%);background:#0d1628ee;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 80px #0007}.login-logo{width:65px;height:65px;border-radius:18px;display:grid;place-items:center;margin:0 auto 15px;font-size:30px;background:linear-gradient(135deg,var(--blue),var(--purple))}.login-box h1{text-align:center;margin:0}.login-box p{text-align:center;color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#3b82f611;border:1px solid #3b82f633;color:#93c5fd;font-size:13px;margin-bottom:14px}
.member-card{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);background:var(--panel2);border-radius:13px;margin:9px 0}.member-avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#172033}.member-info{flex:1}.member-name{font-weight:900}.member-meta{color:var(--muted);font-size:12px;margin-top:3px}
.request-card{padding:15px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;margin:10px 0}.request-top{display:flex;justify-content:space-between;gap:10px}.request-code{font-family:monospace;color:#93c5fd;font-weight:900}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}.toggle-switch{width:55px;height:30px;border-radius:999px;background:#475569;padding:3px;transition:.2s}.toggle-switch span{display:block;width:24px;height:24px;background:white;border-radius:50%;transition:.2s}.toggle-switch.on{background:var(--green)}.toggle-switch.on span{transform:translateX(25px)}
@media(max-width:900px){.sidebar{width:75px}.nav{text-align:center;font-size:0}.nav:first-letter{font-size:18px}.nav-title,.admin-label{display:none}.main{margin-left:75px}}

.mobile-nav{display:none}
img,video{max-width:100%}
@media(max-width:650px){
 body{overflow-x:hidden}.header{height:62px;padding:0 10px;gap:8px}.brand{font-size:15px;gap:7px;white-space:nowrap}.logo{width:34px;height:34px;border-radius:10px}.header-right{gap:6px}.header-right .profile-mini span{display:none}.header-right .avatar{width:32px;height:32px}.header-right .btn{padding:8px 9px;font-size:11px;white-space:nowrap}
 .sidebar{display:none}.main{width:100%;max-width:100%;margin:0;padding:78px 12px calc(92px + env(safe-area-inset-bottom));overflow-wrap:anywhere}.page-title{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:16px}.page-title h1{font-size:23px;line-height:1.25}.page-title p{font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px;border-radius:14px;min-width:0}.stat-number{font-size:25px}.stat-icon{font-size:24px}.account-grid{grid-template-columns:minmax(0,1fr);gap:12px}.account-image{height:180px}.account-name{font-size:18px}.toolbar{gap:8px}.toolbar .search{flex:1 1 100%;min-width:0}.toolbar .btn{flex:1 1 auto}.form-grid{grid-template-columns:minmax(0,1fr);gap:8px}.field.full{grid-column:auto}.field input,.field textarea,.field select{font-size:16px;min-height:44px}.field textarea{min-height:100px}.btn{min-height:40px}.btn.small{min-height:34px}.image-upload-box{padding:12px}.image-upload-box input[type=file]{width:100%;max-width:100%;font-size:13px}.image-preview-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.table-wrap{max-width:100%;overflow-x:auto}.chat{height:calc(100dvh - 180px);min-height:300px;border-radius:14px}.chat-head{padding:12px}.chat-messages{padding:12px}.chat-input{padding:9px;gap:6px}.chat-input input{min-width:0;width:100%;font-size:16px}.message-body{max-width:85%}.dialog{padding:16px;max-height:86dvh}.login{padding:14px}.login-box{padding:22px 18px;width:100%}.mobile-nav{position:fixed;display:flex;left:0;right:0;bottom:0;z-index:80;justify-content:space-around;align-items:stretch;gap:0;padding:7px 3px calc(7px + env(safe-area-inset-bottom));background:#0b1120f5;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.mobile-nav-item{display:flex;flex:1;min-width:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 1px;border:0;border-radius:9px;background:transparent;color:var(--muted)}.mobile-nav-item span{font-size:19px;line-height:1.1}.mobile-nav-item small{font-size:9px;white-space:nowrap}.mobile-nav-item.active{color:#fff;background:#3b82f625}.toggle{padding:12px}.request-top{flex-wrap:wrap}.member-card{padding:10px;gap:9px}
}
@media(max-width:380px){.brand{font-size:13px}.header-right .btn{font-size:10px;padding:7px}.grid{grid-template-columns:minmax(0,1fr)}.mobile-nav-item small{font-size:8px}.main{padding-left:10px;padding-right:10px}}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div id="dialog" class="dialog"></div></div>
<script>
/* KHOACCTKIEN — demo frontend dùng localStorage */
const STORAGE={users:"gamevault_users",accounts:"gamevault_accounts",requests:"gamevault_requests",chat:"gamevault_chat",settings:"gamevault_settings",current:"gamevault_current_user"};
const ADMIN_CONFIRM_CODE="KIEN2026";
const NAME_CHANGE_COOLDOWN=14*24*60*60*1000;
let users=[],accounts=[],requests=[],chat=[],settings={chatEnabled:true};
let pendingAccountImages=[];
let currentUserId=null,currentPage="dashboard",currentGame="Roblox";

function loadData(){
 users=JSON.parse(localStorage.getItem(STORAGE.users)||"null")||[
 {id:"admin",username:"admin",password:"admin123",avatar:"",role:"admin",status:"active",createdAt:Date.now(),lastNameChangeAt:null},
 {id:"user1",username:"Thanh",password:"123456",avatar:"",role:"user",status:"active",createdAt:Date.now(),lastNameChangeAt:null}];
 /* Sửa dữ liệu cũ: nếu trình duyệt đã có danh sách người dùng nhưng thiếu admin,
    tự bổ sung tài khoản quản trị mặc định. */
 let adminUser=users.find(u=>String(u.username||"").toLowerCase()==="admin");
 if(!adminUser){
   adminUser={id:"admin",username:"admin",password:"admin123",avatar:"",role:"admin",status:"active",createdAt:Date.now(),lastNameChangeAt:null};
   users.unshift(adminUser);
 }else{
   adminUser.role="admin";
   /* Khôi phục thông tin đăng nhập demo để tránh dữ liệu cũ làm khóa admin. */
   adminUser.username="admin";
   adminUser.password="admin123";
   adminUser.status="active";
 }
 accounts=JSON.parse(localStorage.getItem(STORAGE.accounts)||"null")||[
 {id:"acc1",game:"Roblox",name:"KienGaming",password:"DemoPassword123",code:"ACC-RBL-001",email:"kien@gmail.com",phone:"",image:"",note:"Tài khoản Roblox chính",status:"active",createdAt:Date.now()},
 {id:"acc2",game:"Roblox",name:"KienRBL2",password:"RobloxDemo456",code:"ACC-RBL-002",email:"kien@gmail.com",phone:"",image:"",note:"Tài khoản Roblox phụ",status:"active",createdAt:Date.now()},
 {id:"acc3",game:"Free Fire",name:"KienFF",password:"FreeFireDemo111",code:"ACC-FF-001",email:"kien@gmail.com",phone:"",image:"",note:"Tài khoản Free Fire",status:"active",createdAt:Date.now()},
 {id:"acc4",game:"Liên Quân",name:"KienLienQuan",password:"DemoLienQuan123",code:"ACC-LQ-001",email:"",phone:"",image:"",note:"Tài khoản Liên Quân mẫu",status:"active",createdAt:Date.now()}];
 /* Tự thêm mục mẫu Liên Quân cho dữ liệu cũ đã lưu từ phiên bản trước. */
 if(!accounts.some(a=>a.game==="Liên Quân")){
   accounts.push({id:"acc4",game:"Liên Quân",name:"KienLienQuan",password:"DemoLienQuan123",code:generateCode("Liên Quân"),email:"",phone:"",image:"",note:"Tài khoản Liên Quân mẫu",status:"active",createdAt:Date.now()});
 }
 requests=JSON.parse(localStorage.getItem(STORAGE.requests)||"[]");
 chat=JSON.parse(localStorage.getItem(STORAGE.chat)||"[]");
 settings=JSON.parse(localStorage.getItem(STORAGE.settings)||"null")||{chatEnabled:true};
 currentUserId=localStorage.getItem(STORAGE.current)||null;
 saveAll();
}
function saveAll(){localStorage.setItem(STORAGE.users,JSON.stringify(users));localStorage.setItem(STORAGE.accounts,JSON.stringify(accounts));localStorage.setItem(STORAGE.requests,JSON.stringify(requests));localStorage.setItem(STORAGE.chat,JSON.stringify(chat));localStorage.setItem(STORAGE.settings,JSON.stringify(settings))}
function esc(value){return String(value??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function currentUser(){return users.find(u=>u.id===currentUserId)||null}
function isAdmin(){return currentUser()?.role==="admin"}
function gameIcon(game){return game==="Roblox"?"🎮":game==="Free Fire"?"🔥":"⚔️"}
function gameLabel(game){return game==="Roblox"?"ROBLOX":game==="Free Fire"?"FREE FIRE":"LIÊN QUÂN MOBILE"}
function avatarHTML(user,className="avatar"){return user?.avatar?`<img class="${className}" src="${esc(user.avatar)}">`:`<div class="${className}">👤</div>`}
function toast(message){const old=document.querySelector(".toast");if(old)old.remove();const el=document.createElement("div");el.className="toast";el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
function openModal(html){document.getElementById("dialog").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function loginPage(register=false){
 document.getElementById("app").innerHTML=`<div class="login"><div class="login-box"><div class="login-logo">🎮</div><h1>KHOACCTKIEN</h1><p>Kho quản lý tài khoản game</p><div class="notice">🔐 Hệ thống lưu dữ liệu trên trình duyệt này.</div>
 <div class="field"><label>Tên tài khoản</label><input id="loginUsername" placeholder="Tên tài khoản"></div>
 <div class="field"><label>Mật khẩu</label><input id="loginPassword" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter')doLogin(${register})"></div>
 ${register?`<div class="field"><label>Nhập lại mật khẩu</label><input id="loginConfirm" type="password"></div>`:""}
 <button class="btn" style="width:100%" onclick="doLogin(${register})">${register?"Tạo tài khoản":"Đăng nhập"}</button>
 <p style="margin-top:18px">${register?"Đã có tài khoản?":"Chưa có tài khoản?"} <span style="color:#60a5fa;font-weight:800;cursor:pointer" onclick="loginPage(${!register})">${register?"Đăng nhập":"Đăng ký"}</span></p>
 ${!register?`<div style="font-size:11px;color:#64748b;text-align:center">Demo Admin: admin / admin123</div>`:""}</div></div>`;
}
function doLogin(register){
 const username=document.getElementById("loginUsername").value.trim(),password=document.getElementById("loginPassword").value;
 if(!username||!password){toast("Vui lòng nhập đủ thông tin.");return}
 if(register){
  const confirm=document.getElementById("loginConfirm").value;
  if(password.length<6){toast("Mật khẩu phải có ít nhất 6 ký tự.");return}
  if(password!==confirm){toast("Mật khẩu nhập lại không khớp.");return}
  if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){toast("Tên tài khoản đã tồn tại.");return}
  const user={id:id(),username,password,avatar:"",role:"user",status:"active",createdAt:Date.now(),lastNameChangeAt:null};users.push(user);saveAll();currentUserId=user.id;localStorage.setItem(STORAGE.current,user.id);dashboard();toast("Tạo tài khoản thành công.");
 }else{
  const user=users.find(u=>String(u.username||"").trim().toLowerCase()===username.toLowerCase()&&u.password===password);
  if(!user){toast("Sai tài khoản hoặc mật khẩu. Hãy nhập admin và admin123.");return}if(user.status==="blocked"&&user.role!=="admin"){toast("Tài khoản đã bị khóa.");return}
  currentUserId=user.id;localStorage.setItem(STORAGE.current,user.id);dashboard();
 }
}
function logout(){currentUserId=null;localStorage.removeItem(STORAGE.current);loginPage()}

function layout(content){
 const user=currentUser();
 document.getElementById("app").innerHTML=`<div class="header"><div class="brand"><div class="logo">🎮</div>KHOACCTKIEN</div><div class="header-right"><div class="profile-mini" onclick="profilePage()">${avatarHTML(user)}<span>${esc(user.username)}</span></div><button class="btn secondary small" onclick="logout()">Đăng xuất</button></div></div>
 <aside class="sidebar"><div class="nav-title">MENU</div>
 <button class="nav ${currentPage==="dashboard"?"active":""}" onclick="dashboard()">🏠 Tổng quan</button>
 <button class="nav ${currentPage==="roblox"?"active":""}" onclick="gamePage('Roblox')">🎮 ROBLOX</button>

 <div class="grid">

function gamePage(game){
 currentGame=game;currentPage=game==="Roblox"?"roblox":game==="Free Fire"?"ff":"lienquan";
 const q=window.gameSearch||"";
 const filtered=accounts.filter(a=>a.game===game&&(a.name.toLowerCase().includes(q.toLowerCase())||a.code.toLowerCase().includes(q.toLowerCase())||(a.note||"").toLowerCase().includes(q.toLowerCase())));
 layout(`<div class="page-title"><div><h1>${gameIcon(game)} ${gameLabel(game)}</h1><p>${filtered.length} tài khoản</p></div>${isAdmin()?`<button class="btn" onclick="addAccountPage()">➕ Thêm tài khoản</button>`:""}</div>
 <div class="toolbar"><input class="search" placeholder="🔎 Tìm theo tên, mã tài khoản, ghi chú..." value="${esc(q)}" oninput="window.gameSearch=this.value;gamePage('${game}')"></div>
 <div class="account-grid">${filtered.length?filtered.map(accountCard).join(""):`<div class="card empty">Không tìm thấy tài khoản ${esc(game)}.</div>`}</div>`);
}
function accountCard(a){
 const admin=isAdmin();
 return `<div class="card account"><div class="account-image">${(a.images&&a.images.length)?`<div class="account-image-gallery">${a.images.map((src,i)=>`<img src="${esc(src)}" alt="Ảnh tài khoản ${i+1}" loading="lazy">`).join("")}</div>`:a.image?`<img src="${esc(a.image)}" alt="Ảnh tài khoản" loading="lazy">`:gameIcon(a.game)}</div><div class="account-game">${gameIcon(a.game)} ${gameLabel(a.game)}</div><div class="account-name">${esc(a.name)}</div><span class="code">${esc(a.code)}</span>
 ${admin?`<div class="note">📧 ${esc(a.email||"Chưa liên kết")}</div>`:""}<div class="note">${esc(a.note||"Không có ghi chú")}</div>
 ${admin?`<div class="password-box">🔑 ${esc(a.password)}</div>`:`<div class="password-box">🔒 Mật khẩu được bảo vệ</div>`}
 <div class="account-actions"><button class="btn small" onclick="requestPassword('${a.id}')">📩 Yêu cầu mật khẩu</button><button class="btn secondary small" onclick="copyText('${esc(a.code)}')">📋 Copy mã</button>${admin?`<button class="btn orange small" onclick="editAccount('${a.id}')">✏️ Sửa</button><button class="btn red small" onclick="deleteAccount('${a.id}')">🗑️ Xóa</button>`:""}</div></div>`;
}
function copyText(text){navigator.clipboard?.writeText(text);toast("Đã sao chép.")}
function accountImagesOf(a){
 if(!a)return [];
 if(Array.isArray(a.images)&&a.images.length)return a.images.filter(Boolean);
 return a.image?[a.image]:[];
}
function accountImagePreviewHtml(images){
 if(!images.length)return '<div class="note" style="margin:8px 0 0">Chưa chọn ảnh nào.</div>';
 return '<div class="image-preview-grid">'+images.map((src,i)=>`<div class="image-preview-item"><img src="${esc(src)}" alt="Ảnh xem trước ${i+1}"></div>`).join('')+'</div>';
}
function addAccountPage(editId=null){
 if(!isAdmin()){toast("Chỉ Admin được thực hiện thao tác này.");return}currentPage="add";
 const a=editId?accounts.find(x=>x.id===editId):null;
 pendingAccountImages=[];
 const existingImages=accountImagesOf(a);
 window.currentAccountImages=existingImages.slice();
 const urlImage=a?.image&&!a.image.startsWith('data:')?a.image:'';
 layout(`<div class="page-title"><div><h1>${a?"✏️ Sửa tài khoản":"➕ Thêm tài khoản"}</h1><p>Hỗ trợ Roblox, Free Fire và Liên Quân Mobile.</p></div></div><div class="card"><div class="form-grid">
 <div class="field"><label>🎮 Game</label><select id="accGame"><option value="Roblox" ${a?.game==="Roblox"?"selected":""}>🎮 Roblox</option><option value="Free Fire" ${a?.game==="Free Fire"?"selected":""}>🔥 Free Fire</option><option value="Liên Quân" ${a?.game==="Liên Quân"?"selected":""}>⚔️ Liên Quân Mobile</option></select></div>
 <div class="field"><label>🏷️ Tên tài khoản</label><input id="accName" value="${esc(a?.name||"")}" placeholder="Tên tài khoản game"></div>
 <div class="field"><label>🔐 Mật khẩu</label><input id="accPassword" value="${esc(a?.password||"")}" placeholder="Mật khẩu"></div>
 <div class="field"><label>📧 Email liên kết</label><input id="accEmail" value="${esc(a?.email||"")}" placeholder="email@gmail.com"></div>
 <div class="field"><label>📱 Số điện thoại</label><input id="accPhone" value="${esc(a?.phone||"")}" placeholder="Không bắt buộc"></div>
 <div class="field"><label>🔗 Link ảnh (không bắt buộc)</label><input id="accImage" value="${esc(urlImage)}" placeholder="Có thể bỏ trống nếu tải ảnh từ máy"></div>
 <div class="field full"><label>🖼️ Tải ảnh từ máy tính / điện thoại</label><div class="image-upload-box"><input id="accImageFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="handleAccountImageFiles(event)"><div class="image-preview-label">Chọn tối đa 5 ảnh JPG, PNG hoặc WEBP. Ảnh sẽ được nén để tiết kiệm dung lượng.</div><div id="accImagePreview">${accountImagePreviewHtml(existingImages)}</div><button type="button" class="btn secondary small" style="margin-top:10px" onclick="clearAccountImageSelection()">Bỏ ảnh mới đã chọn</button></div></div>
 <div class="field full"><label>📝 Ghi chú</label><textarea id="accNote" placeholder="Ghi chú về tài khoản...">${esc(a?.note||"")}</textarea></div>
 </div><div class="modal-actions"><button class="btn secondary" onclick="gamePage(currentGame)">Hủy</button><button class="btn" onclick="${a?`saveEditAccount('${a.id}')`:"createAccount()"}">💾 ${a?"Lưu thay đổi":"Tạo tài khoản"}</button></div></div>`);
}
function compressAccountImage(file){
 return new Promise((resolve,reject)=>{
  if(!file.type.match(/^image\/(jpeg|png|webp)$/)){reject(new Error('Chỉ hỗ trợ JPG, PNG hoặc WEBP.'));return}
  if(file.size>12*1024*1024){reject(new Error('Mỗi ảnh phải nhỏ hơn 12 MB trước khi nén.'));return}
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('Không đọc được tệp ảnh.'));
  reader.onload=()=>{
   const img=new Image();img.onerror=()=>reject(new Error('Tệp ảnh không hợp lệ.'));
   img.onload=()=>{
    let scale=Math.min(1,1200/img.width,1200/img.height),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    let quality=.78,data=canvas.toDataURL('image/jpeg',quality);
    while(data.length>260000&&quality>.42){quality-=.08;data=canvas.toDataURL('image/jpeg',quality)}
    if(data.length>350000){const smaller=document.createElement('canvas');const factor=.7;smaller.width=Math.max(1,Math.round(canvas.width*factor));smaller.height=Math.max(1,Math.round(canvas.height*factor));smaller.getContext('2d').drawImage(canvas,0,0,smaller.width,smaller.height);data=smaller.toDataURL('image/jpeg',.55)}
    resolve(data);
   };img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}
async function handleAccountImageFiles(event){
 const files=Array.from(event.target.files||[]);
 if(!files.length)return;
 if(files.length>5){event.target.value='';toast('Bạn chỉ được chọn tối đa 5 ảnh mỗi lần.');return}
 try{
  toast('Đang xử lý ảnh...');
  pendingAccountImages=await Promise.all(files.map(compressAccountImage));
  const preview=document.getElementById('accImagePreview');if(preview)preview.innerHTML=accountImagePreviewHtml(pendingAccountImages);
  toast(`Đã chọn ${pendingAccountImages.length} ảnh. Nhấn lưu để hoàn tất.`);
 }catch(err){pendingAccountImages=[];event.target.value='';toast(err.message||'Không thể xử lý ảnh.');}
}
function clearAccountImageSelection(){
 pendingAccountImages=[];const input=document.getElementById('accImageFiles');if(input)input.value='';
 const preview=document.getElementById('accImagePreview');if(preview)preview.innerHTML=accountImagePreviewHtml(window.currentAccountImages||[]);
}
function generateCode(game){
 const prefix=game==="Roblox"?"ACC-RBL-":game==="Free Fire"?"ACC-FF-":"ACC-LQ-";
 const nums=accounts.filter(a=>a.game===game).map(a=>{const m=(a.code||"").match(/(\d+)$/);return m?Number(m[1]):0});
 return prefix+(Math.max(0,...nums)+1).toString().padStart(3,"0");
}
function createAccount(){
 const game=document.getElementById("accGame").value,name=document.getElementById("accName").value.trim(),password=document.getElementById("accPassword").value,email=document.getElementById("accEmail").value.trim(),phone=document.getElementById("accPhone").value.trim(),imageUrl=document.getElementById("accImage").value.trim(),note=document.getElementById("accNote").value.trim();
 if(!["Roblox","Free Fire","Liên Quân"].includes(game)){toast("Game không hợp lệ.");return}
 if(!name||!password){toast("Tên tài khoản và mật khẩu là bắt buộc.");return}
 const images=pendingAccountImages.length?pendingAccountImages.slice():[];
 const image=images[0]||imageUrl||"";
 accounts.push({id:id(),game,name,password,code:generateCode(game),email,phone,image,images:images.length?images:(image?[image]:[]),note,status:"active",createdAt:Date.now()});
 try{saveAll();toast("Đã thêm tài khoản.");gamePage(game)}catch(err){accounts.pop();toast('Không lưu được. Bộ nhớ có thể đã đầy; hãy thử ít ảnh hơn hoặc ảnh nhỏ hơn.');}
}
function editAccount(accountId){window.editingAccountId=accountId;addAccountPage(accountId)}
function saveEditAccount(accountId){
 const a=accounts.find(x=>x.id===accountId);if(!a)return;
 const game=document.getElementById("accGame").value,name=document.getElementById("accName").value.trim(),password=document.getElementById("accPassword").value;
 if(!["Roblox","Free Fire","Liên Quân"].includes(game)){toast("Game không hợp lệ.");return}
 if(!name||!password){toast("Thiếu thông tin tài khoản.");return}
 const old={...a,images:Array.isArray(a.images)?a.images.slice():a.images};
 const imageUrl=document.getElementById("accImage").value.trim();
 const uploaded=pendingAccountImages.length?pendingAccountImages.slice():null;
 a.game=game;a.name=name;a.password=password;a.email=document.getElementById("accEmail").value.trim();a.phone=document.getElementById("accPhone").value.trim();a.note=document.getElementById("accNote").value.trim();
 if(uploaded){a.images=uploaded;a.image=uploaded[0]}
 else if(imageUrl){a.image=imageUrl;a.images=[imageUrl]}
 else if(!a.image){a.images=[]}
 try{saveAll();toast("Đã cập nhật.");gamePage(a.game)}catch(err){Object.assign(a,old);toast('Không lưu được. Bộ nhớ có thể đã đầy; dữ liệu sửa ảnh chưa được lưu.');}
}
function deleteAccount(accountId){if(!confirm("Bạn chắc chắn muốn xóa tài khoản này?"))return;accounts=accounts.filter(a=>a.id!==accountId);saveAll();toast("Đã xóa tài khoản.");gamePage(currentGame)}

function requestPassword(accountId){
 const a=accounts.find(x=>x.id===accountId);if(!a)return;
 const existing=requests.find(r=>r.accountId===accountId&&r.requesterId===currentUserId&&r.status==="pending");
 if(existing){toast("Bạn đã gửi yêu cầu cho tài khoản này.");return}
 openModal(`<h2>📩 Yêu cầu mật khẩu</h2><div class="notice">Bạn đang yêu cầu mật khẩu của tài khoản:</div><div class="card"><b>🎮 Game:</b> ${esc(a.game)}<br><br><b>🏷️ Tài khoản:</b> ${esc(a.name)}<br><br><b>🔐 Mã:</b> <span class="code">${esc(a.code)}</span></div><p style="color:#94a3b8">Chỉ cần gửi mã tài khoản. Không cần nhập tên thành viên.</p><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Hủy</button><button class="btn" onclick="sendPasswordRequest('${a.id}')">📩 Gửi mã</button></div>`);
}
function sendPasswordRequest(accountId){
 const a=accounts.find(x=>x.id===accountId);if(!a)return;
 requests.push({id:id(),requesterId:currentUserId,requesterUsername:currentUser().username,accountId,accountCode:a.code,game:a.game,requestedAt:Date.now(),status:"pending",processedAt:null});saveAll();closeModal();toast("Đã gửi yêu cầu mật khẩu.");
}
function requestPage(){
 if(!isAdmin())return;currentPage="requests";const pending=requests.filter(r=>r.status==="pending").sort((a,b)=>b.requestedAt-a.requestedAt),done=requests.filter(r=>r.status==="done").sort((a,b)=>b.requestedAt-a.requestedAt);
 layout(`<div class="page-title"><div><h1>📩 Yêu cầu mật khẩu</h1><p>Quản lý yêu cầu từ thành viên.</p></div></div><div class="card"><h2>⏳ Đang chờ (${pending.length})</h2>${pending.length?pending.map(requestCard).join(""):'<div class="empty">Không có yêu cầu đang chờ.</div>'}</div><div class="card" style="margin-top:18px"><h2>✅ Đã xử lý (${done.length})</h2>${done.length?done.map(requestCard).join(""):'<div class="empty">Chưa có yêu cầu đã xử lý.</div>'}</div>`);
}
function requestCard(r){
 const a=accounts.find(x=>x.id===r.accountId);
 return `<div class="request-card"><div class="request-top"><div><b>👤 ${esc(r.requesterUsername)}</b><div style="color:#94a3b8;font-size:12px;margin-top:5px">${new Date(r.requestedAt).toLocaleString("vi-VN")}</div></div><span class="badge ${r.status==="pending"?"orange":"green"}">${r.status==="pending"?"ĐANG CHỜ":"ĐÃ XỬ LÝ"}</span></div><div style="margin-top:12px">🎮 ${esc(r.game)}<br>🔐 <span class="request-code">${esc(r.accountCode)}</span>${a?`<br><br>🏷️ ${esc(a.name)}`:""}</div>${r.status==="pending"&&a?`<div class="account-actions" style="margin-top:12px"><button class="btn green small" onclick="processRequest('${r.id}')">🔓 Cấp mật khẩu</button><button class="btn red small" onclick="deleteRequest('${r.id}')">🗑️ Từ chối</button></div>`:""}</div>`;
}
function processRequest(requestId){
 const r=requests.find(x=>x.id===requestId),a=accounts.find(x=>x.id===r?.accountId);if(!r||!a)return;
 openModal(`<h2>🔓 Cấp mật khẩu</h2><div class="notice">Yêu cầu từ: <b>${esc(r.requesterUsername)}</b></div><div class="password-box">🔐 ${esc(a.password)}</div><p style="color:#94a3b8;font-size:13px">Sau khi xác nhận, yêu cầu sẽ chuyển sang trạng thái đã xử lý.</p><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Hủy</button><button class="btn green" onclick="completeRequest('${r.id}')">✅ Xác nhận cấp</button></div>`);
}
function completeRequest(requestId){const r=requests.find(x=>x.id===requestId);if(!r)return;r.status="done";r.processedAt=Date.now();saveAll();closeModal();requestPage();toast("Đã xử lý yêu cầu.")}
function deleteRequest(requestId){if(!confirm("Xóa yêu cầu này?"))return;requests=requests.filter(r=>r.id!==requestId);saveAll();requestPage()}

function emailPage(){
 if(!isAdmin())return;currentPage="email";const groups={};accounts.forEach(a=>{if(a.email){if(!groups[a.email])groups[a.email]=[];groups[a.email].push(a)}});
 layout(`<div class="page-title"><div><h1>📧 EMAIL LIÊN KẾT</h1><p>Một email có thể liên kết với nhiều tài khoản.</p></div></div><div class="toolbar"><input class="search" id="emailSearch" placeholder="🔎 Tìm email, mã tài khoản, tên tài khoản, game..." oninput="renderEmailGroups(this.value)"></div><div id="emailGroups">${emailGroupsHTML(groups)}</div>`);
}
function emailGroupsHTML(groups,query=""){
 const q=query.toLowerCase();let html="";
 Object.entries(groups).forEach(([email,list])=>{const match=email.toLowerCase().includes(q)||list.some(a=>a.name.toLowerCase().includes(q)||a.code.toLowerCase().includes(q)||a.game.toLowerCase().includes(q));if(!match)return;
 html+=`<div class="email-group"><div class="email-head"><div>📧 <b>${esc(email)}</b></div><span class="badge blue">${list.length} tài khoản</span></div><div class="email-list">${list.map(a=>`<div class="email-account">${gameIcon(a.game)} — <b>${esc(a.code)}</b> — ${esc(a.name)} <span style="float:right;color:#64748b">${esc(a.game)}</span></div>`).join("")}</div></div>`});
 return html||`<div class="card empty">Không tìm thấy email liên kết.</div>`;
}
function renderEmailGroups(query){const groups={};accounts.forEach(a=>{if(a.email){if(!groups[a.email])groups[a.email]=[];groups[a.email].push(a)}});document.getElementById("emailGroups").innerHTML=emailGroupsHTML(groups,query)}

function membersPage(){if(!isAdmin())return;currentPage="members";layout(`<div class="page-title"><div><h1>👥 THÀNH VIÊN</h1><p>Quản lý tài khoản thành viên.</p></div></div><div class="card">${users.map(memberCard).join("")}</div>`)}
function memberCard(u){return `<div class="member-card">${avatarHTML(u,"member-avatar")}<div class="member-info"><div class="member-name">${esc(u.username)} ${u.role==="admin"?`<span class="badge red">ADMIN</span>`:`<span class="badge blue">THÀNH VIÊN</span>`}</div><div class="member-meta">ID: ${esc(u.id)} • ${u.status==="blocked"?"🔴 Đã khóa":"🟢 Hoạt động"}</div></div><div>${u.id!=="admin"?`<button class="btn ${u.status==="blocked"?"green":"red"} small" onclick="toggleMember('${u.id}')">${u.status==="blocked"?"🔓 Mở khóa":"🔒 Khóa"}</button>`:""}</div></div>`}
function toggleMember(memberId){const u=users.find(x=>x.id===memberId);if(!u)return;u.status=u.status==="blocked"?"active":"blocked";saveAll();membersPage()}

function chatPage(){
 currentPage="chat";layout(`<div class="page-title"><div><h1>💬 KÊNH CHAT TỔNG</h1><p>Trao đổi với các thành viên KHOACCTKIEN.</p></div>${isAdmin()?`<button class="btn ${settings.chatEnabled?"red":"green"}" onclick="toggleChatPermission()">${settings.chatEnabled?"🔴 Tắt quyền chat":"🟢 Bật quyền chat"}</button>`:""}</div>
 <div class="chat"><div class="chat-head"><div><h2>🌐 # chat-tổng</h2><div class="chat-status">${settings.chatEnabled?"🟢 Thành viên có thể gửi tin nhắn":"🔴 Chat đang bị khóa quyền gửi"}</div></div>${!settings.chatEnabled?`<span class="badge red">CHAT OFF</span>`:`<span class="badge green">CHAT ON</span>`}</div>
 ${!settings.chatEnabled&&!isAdmin()?`<div class="chat-off"><div style="font-size:35px">🔒</div><h3>Kênh chat đang tạm khóa</h3><p>Quản trị viên đã tắt quyền chat của thành viên.</p></div>`:""}
 <div id="chatMessages" class="chat-messages">${renderMessages()}</div>${settings.chatEnabled||isAdmin()?`<div class="chat-input"><input id="chatInput" placeholder="${isAdmin()?"Gửi thông báo hoặc tin nhắn...":"Nhập tin nhắn..."}" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">➤</button></div>`:""}</div>`);scrollChat();
}
function renderMessages(){if(!chat.length)return `<div class="empty">Chưa có tin nhắn nào.</div>`;return chat.filter(m=>!m.deleted).map(messageHTML).join("")}
function messageHTML(m){
 const user=users.find(u=>u.id===m.userId)||{username:m.username,avatar:""},mine=m.userId===currentUserId;
 return `<div class="message ${mine?"me":""}">${avatarHTML(user,"message-avatar")}<div class="message-body"><div class="message-name">${esc(m.username)}${m.role==="admin"?` <span class="badge red">👑 QUẢN TRỊ VIÊN</span>`:""}${m.pinned?` <span class="badge orange">📌 GHIM</span>`:""}</div><div class="message-bubble">${esc(m.text)}</div><div class="message-time">${new Date(m.time).toLocaleString("vi-VN")}${isAdmin()?` • <span style="color:#60a5fa;cursor:pointer" onclick="pinMessage('${m.id}')">${m.pinned?"Bỏ ghim":"Ghim"}</span> • <span style="color:#f87171;cursor:pointer" onclick="deleteMessage('${m.id}')">Xóa</span>`:""}</div></div></div>`;
}
function sendChat(){if(!settings.chatEnabled&&!isAdmin()){toast("Chat đang bị khóa.");return}const input=document.getElementById("chatInput"),text=input?.value.trim();if(!text)return;const u=currentUser();chat.push({id:id(),userId:u.id,username:u.username,avatar:u.avatar||"",role:u.role,text,time:Date.now(),pinned:false,deleted:false});saveAll();input.value="";chatPage()}
function toggleChatPermission(){if(!isAdmin())return;settings.chatEnabled=!settings.chatEnabled;saveAll();chatPage();toast(settings.chatEnabled?"Đã bật quyền chat.":"Đã tắt quyền chat.")}
function pinMessage(messageId){const m=chat.find(x=>x.id===messageId);if(!m)return;m.pinned=!m.pinned;saveAll();chatPage()}
function deleteMessage(messageId){if(!confirm("Xóa tin nhắn này?"))return;const m=chat.find(x=>x.id===messageId);if(m)m.deleted=true;saveAll();chatPage()}
function scrollChat(){const box=document.getElementById("chatMessages");if(box)box.scrollTop=box.scrollHeight}

function profilePage(){
 currentPage="profile";const u=currentUser();let cooldownText="Có thể đổi tên ngay.";
 if(u.lastNameChangeAt){const remain=NAME_CHANGE_COOLDOWN-(Date.now()-u.lastNameChangeAt);if(remain>0){const days=Math.ceil(remain/86400000),hours=Math.ceil((remain%86400000)/3600000);cooldownText=`⏳ Bạn đã đổi tên gần đây. Có thể đổi lại sau khoảng ${days} ngày ${hours} giờ.`}}
 layout(`<div class="page-title"><div><h1>👤 TÀI KHOẢN</h1><p>Quản lý hồ sơ cá nhân của bạn.</p></div></div><div class="card profile-card"><div style="text-align:center"><div id="avatarPreview" class="profile-avatar-big">${u.avatar?`<img src="${esc(u.avatar)}" style="width:100%;height:100%;object-fit:cover">`:"👤"}</div><label class="btn">📷 Đổi ảnh đại diện<input id="avatarFile" type="file" accept="image/*" style="display:none" onchange="previewProfileAvatar(event)"></label></div>
 <div class="field"><label>👤 Tên tài khoản</label><input id="newUsername" value="${esc(u.username)}" ${u.lastNameChangeAt&&Date.now()-u.lastNameChangeAt<NAME_CHANGE_COOLDOWN?"disabled":""}></div><div class="cooldown">${cooldownText}</div><div class="field"><label>🔑 Mật khẩu mới</label><input id="newPassword" type="password" placeholder="Để trống nếu không đổi"></div><div class="modal-actions"><button class="btn" onclick="saveProfile()">💾 Lưu thay đổi</button></div></div>`);
}
let profileAvatarData=null;
function previewProfileAvatar(event){const file=event.target.files[0];if(!file)return;if(!file.type.startsWith("image/")){toast("File không phải hình ảnh.");return}const reader=new FileReader();reader.onload=e=>{profileAvatarData=e.target.result;document.getElementById("avatarPreview").innerHTML=`<img src="${profileAvatarData}" style="width:100%;height:100%;object-fit:cover">`};reader.readAsDataURL(file)}
function saveProfile(){
 const u=currentUser();if(!u)return;const newName=document.getElementById("newUsername").value.trim(),newPassword=document.getElementById("newPassword").value;
 if(!newName){toast("Tên tài khoản không được để trống.");return}
 if(newName!==u.username){
  if(u.lastNameChangeAt&&Date.now()-u.lastNameChangeAt<NAME_CHANGE_COOLDOWN){toast(`Bạn phải chờ thêm ${Math.ceil((NAME_CHANGE_COOLDOWN-(Date.now()-u.lastNameChangeAt))/86400000)} ngày để đổi tên.`);return}
  if(users.some(x=>x.id!==u.id&&x.username.toLowerCase()===newName.toLowerCase())){toast("Tên tài khoản đã được sử dụng.");return}
  u.username=newName;u.lastNameChangeAt=Date.now();requests.forEach(r=>{if(r.requesterId===u.id)r.requesterUsername=u.username});chat.forEach(m=>{if(m.userId===u.id)m.username=u.username});
 }
 if(newPassword){if(newPassword.length<6){toast("Mật khẩu phải có ít nhất 6 ký tự.");return}u.password=newPassword}
 if(profileAvatarData){u.avatar=profileAvatarData;chat.forEach(m=>{if(m.userId===u.id)m.avatar=u.avatar})}
 profileAvatarData=null;saveAll();profilePage();toast("Đã cập nhật tài khoản.");
}

function settingsPage(){
 if(!isAdmin())return;currentPage="settings";
 layout(`<div class="page-title"><div><h1>⚙️ CÀI ĐẶT</h1><p>Cài đặt hệ thống KHOACCTKIEN.</p></div></div>
 <div class="card"><h2>💬 Kênh chat tổng</h2><div class="toggle"><div><b>Quyền chat của thành viên</b><div style="color:#94a3b8;font-size:13px;margin-top:5px">${settings.chatEnabled?"Thành viên hiện có thể gửi tin nhắn.":"Thành viên hiện không thể gửi tin nhắn."}</div></div><button class="toggle-switch ${settings.chatEnabled?"on":""}" onclick="toggleChatPermission()"><span></span></button></div><div style="margin-top:12px"><button class="btn ${settings.chatEnabled?"red":"green"}" onclick="toggleChatPermission()">${settings.chatEnabled?"🔴 Tắt quyền chat":"🟢 Bật quyền chat"}</button></div></div>
 <div class="card" style="margin-top:18px"><h2>🔐 Tài khoản quản trị</h2><p style="color:#94a3b8">Thông tin quản trị chỉ hiển thị sau khi xác nhận mã bảo mật.</p><button class="btn" onclick="adminCredentials()">🔐 Xem TKMK thành viên</button></div>
 <div class="card" style="margin-top:18px"><h2>⚠️ Dữ liệu demo</h2><p style="color:#94a3b8">KHOACCTKIEN hiện lưu dữ liệu bằng localStorage. Nếu xóa dữ liệu trình duyệt, dữ liệu demo cũng mất.</p><button class="btn red" onclick="resetDemo()">🗑️ Reset toàn bộ dữ liệu</button></div>`);
}
function adminCredentials(){openModal(`<h2>🔐 Xác nhận quyền Admin</h2><p style="color:#94a3b8">Nhập mã xác nhận quản trị viên.</p><div class="field"><label>Mã bảo mật</label><input id="adminCode" type="password" placeholder="Nhập mã..."></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Hủy</button><button class="btn" onclick="verifyAdminCode()">Xác nhận</button></div>`)}
function verifyAdminCode(){
 if(document.getElementById("adminCode").value!==ADMIN_CONFIRM_CODE){toast("Mã xác nhận không đúng.");return}closeModal();
 openModal(`<h2>🔐 TKMK THÀNH VIÊN</h2><div class="notice">⚠️ Đây là thông tin nhạy cảm. Chỉ Admin mới được xem.</div>${users.map(u=>`<div class="member-card">${avatarHTML(u,"member-avatar")}<div class="member-info"><div class="member-name">${esc(u.username)}</div><div class="member-meta">Tài khoản: <b style="color:#60a5fa">${esc(u.username)}</b><br>Mật khẩu: <b style="color:#fbbf24">${esc(u.password)}</b></div></div></div>`).join("")}<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Đóng</button></div>`);
}
function resetDemo(){if(!confirm("CẢNH BÁO: Xóa toàn bộ dữ liệu KHOACCTKIEN trên trình duyệt?"))return;Object.values(STORAGE).forEach(k=>localStorage.removeItem(k));location.reload()}

loadData();
if(currentUser())dashboard();else loginPage();
</script>
</body>
</html>
